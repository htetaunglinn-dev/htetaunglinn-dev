name: Update activity card

on:
  schedule:
    - cron: "17 0 * * *" # daily, 07:17 Bangkok time
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/update-activity.yml"

permissions:
  contents: write

concurrency:
  group: update-activity
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: add a classic PAT with read:user as PROFILE_TOKEN to count
          # private contributions the same way your profile page does.
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: |
          node scripts/build-static.mjs
          node scripts/generate-stats.mjs

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain assets)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets
            git commit -m "chore: refresh activity card"
            git push
          else
            echo "No changes"
          fi
